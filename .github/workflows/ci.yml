name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # TestCompatUnreachable waits out 7 x 30s network timeouts - irrelevant to
      # dependency bumps; run it locally before feature commits instead.
      - run: go test ./... -count=1 -skip TestCompatUnreachable
