# Daily Renovate triage: approve and apply dependency PRs (all classes - major,
# minor, patch, digest/pin) when their ci run is green; if main's ci goes red after
# a merge, revert that PR and open a "manual fix required" issue. CVE-flagged
# merges trigger an immediate patch release via release.yml.
#
# Identity split: the job's GITHUB_TOKEN approves PRs and files issues (a different
# identity from the PAT that authored the Renovate PRs); merges and reverts use
# GH_PAT, which can push to the protected main branch.
#
# The job checks out nothing - every gh call targets -R "$GITHUB_REPOSITORY".
#
# Boundary: weekly e2e failures (behavior-level, not attributable to one PR) are
# never auto-reverted - file an issue manually if the mcp-e2e workflow fails.
name: renovate-triage

on:
  schedule:
    - cron: "30 4 * * *" # daily, after Renovate's 03:00 run
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }} # default identity: list/review/comment/issue
      PAT: ${{ secrets.GH_PAT }} # merge/revert identity (can push to main)
    steps:
      - name: Triage dependency PRs
        run: |
          set +e # one bad PR must not abort the loop; every step checks its own errors
          REPO="$GITHUB_REPOSITORY"

          echo "== renovate triage $(date -u +%FT%TZ) =="

          # PRs flagged for manual fixes: while such an issue is open, triage skips
          # PRs it references (Renovate re-creates reverted updates; merging them
          # again would loop daily).
          BLOCKED="$(gh issue list -R "$REPO" --state open --json title,body \
            --jq '.[] | select(.title | startswith("manual fix required")) | .body')"

          # Renovate PRs are selected by branch prefix - this repository's Renovate
          # runs apply no labels, so --label would match nothing.
          gh pr list -R "$REPO" --state open --json number,title,headRefName \
            --jq '.[] | select(.headRefName | startswith("renovate/")) | "\(.number)\t\(.title)"' \
          | while IFS=$'\t' read -r NUM TITLE; do
              echo "-- PR #$NUM: $TITLE"

              if echo "$BLOCKED" | grep -q "#$NUM"; then
                echo "   skip: flagged for manual fix"
                continue
              fi

              # Wait up to 10 minutes for OUR ci workflow on the PR branch. Renovate's
              # own statuses (e.g. renovate/artifacts) are not gates - a broken
              # update fails ci anyway. PRs opened before ci.yml existed have no
              # run at all: update the branch once to fire a synchronize event.
              BRANCH="$(gh pr view -R "$REPO" "$NUM" --json headRefName --jq .headRefName)"
              GREEN=""
              FIRST=1
              for _ in $(seq 1 20); do
                RUN="$(gh run list -R "$REPO" --workflow ci.yml --branch "$BRANCH" \
                  --json status,conclusion --jq '(.[0] // {}) | .status + "/" + (.conclusion // "-")' 2>/dev/null)"
                case "$RUN" in
                  "/-"|"/") if [ "$FIRST" = "1" ]; then
                               # PAT, not GITHUB_TOKEN: token-pushed events are the
                               # only ones that trigger the ci workflow
                               GH_TOKEN="$PAT" gh pr update-branch -R "$REPO" "$NUM" >/dev/null 2>&1
                               FIRST=0
                             fi ;;
                  completed/success) GREEN=1; break ;;
                  completed/*) break ;; # failed or cancelled
                esac
                sleep 30
              done
              if [ -z "$GREEN" ]; then
                # one skip note per PR, not one per daily run
                NOTES="$(gh pr view -R "$REPO" "$NUM" --json comments \
                  --jq '[.[].body | select(contains("renovate-triage: skipped"))] | length' 2>/dev/null)"
                if [ "${NOTES:-0}" = "0" ]; then
                  gh pr comment -R "$REPO" "$NUM" -b "renovate-triage: skipped (ci not green)" >/dev/null 2>&1
                fi
                echo "   skip: ci not green"
                continue
              fi

              # Approve with the job identity; if GitHub rejects the review
              # (identity rules), proceed - the merge is the substantive action.
              if ! gh pr review -R "$REPO" "$NUM" --approve -b "automated: green CI (renovate-triage)" >/dev/null 2>&1; then
                echo "   note: review rejected; proceeding to merge"
              fi

              if ! GH_TOKEN="$PAT" gh pr merge -R "$REPO" "$NUM" --squash --delete-branch \
                   --subject "$TITLE (#$NUM)" >/dev/null 2>&1; then
                echo "   error: merge failed"
                continue
              fi
              SHA="$(gh pr view -R "$REPO" "$NUM" --json mergeCommit --jq .mergeCommit.oid)"
              echo "   merged: $SHA; watching main ci"

              # Watch main's ci run for the merge commit (up to 10 minutes).
              MAIN=""
              for _ in $(seq 1 20); do
                RUN="$(gh run list -R "$REPO" --workflow ci.yml --commit "$SHA" \
                  --json status,conclusion --jq '.[0] // empty' 2>/dev/null)"
                if echo "$RUN" | grep -q completed; then
                  if echo "$RUN" | grep -q success; then MAIN=green; else MAIN=red; fi
                  break
                fi
                sleep 30
              done

              if [ "$MAIN" = "green" ]; then
                echo "   main ci green"
              else
                echo "   main ci NOT green - reverting"
                GH_TOKEN="$PAT" gh pr revert -R "$REPO" "$NUM" --merge --delete-branch \
                  --subject "revert: $TITLE (#$NUM)" >/dev/null 2>&1 \
                  || echo "   error: revert failed - MANUAL ACTION REQUIRED"
                gh issue create -R "$REPO" \
                  --title "manual fix required: $TITLE" \
                  --body "PR #$NUM was auto-merged (green PR ci) but main's ci failed, so it was auto-reverted. Renovate will re-create the update; triage skips PRs referenced here while this issue is open. Fix manually, then close this issue." \
                  >/dev/null || echo "   error: issue creation failed"
              fi
            done

          # CVE scan: dependency PRs merged since the last release. Any CVE/GHSA
          # reference triggers an immediate patch release.
          LAST="$(gh release view -R "$REPO" --json createdAt --jq .createdAt 2>/dev/null)"
          if [ -n "$LAST" ]; then
            DATE="${LAST%%T*}"
            HITS="$(gh pr list -R "$REPO" --state merged --search "merged:>=$DATE" \
              --json body,headRefName \
              --jq '.[] | select(.headRefName | startswith("renovate/")) | .body' | grep -cE 'CVE-|GHSA-')"
            echo "== merged dependency PRs since $DATE with CVE references: $HITS"
            if [ "$HITS" -gt 0 ]; then
              echo "== triggering immediate CVE release"
              GH_TOKEN="$PAT" gh workflow run release.yml -R "$REPO" -f reason=cve
            fi
          fi
          echo "== triage complete"
