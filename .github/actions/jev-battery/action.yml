# The Jev judgment battery: one minimal question per tool against a live
# @jkudish/jev-mcp server, guarded so a missing or rejected provider key
# NEVER fails the run (the CI posture: an unpaid bill is not a red build).
# Shared by the reusable mcp-e2e workflow's caller/weekly runs (released mcp)
# and the per-merge repo-built run (preinstalled mcp).
#
# Expects jq and npx (Node) on PATH, and reads TYPESAFE_API_KEY from the
# environment — composite actions cannot read the secrets context, so callers
# pass it via job-level env.
name: "mcp jev battery"
description: "Runs the jev check self-test battery with skip-on-auth semantics"

inputs:
  install:
    description: "release installs the released mcp (skips green until the tag exists); preinstalled expects mcp already on PATH"
    default: release

runs:
  using: composite
  steps:
    # One script on purpose: `exit 0` ends a step, not a job, so separate
    # guard/install steps would let the battery run after every skip. Every
    # skip path lives here, where exit 0 genuinely means "this lane is done
    # and green".
    - name: Jev battery (one question per tool)
      run: |
        set -euo pipefail
        if [ "${JEV_MCP_INSTALL}" = "release" ]; then
          # Pre-release window: until the v1.3.0 tag exists the lane skips
          # green so the weekly schedule cannot go red. The grep is pinned
          # to mcp itself ("cmd/mcp@v1.3.0: invalid version: unknown
          # revision") so a post-release dependency resolution failure —
          # which shares the "unknown revision" wording — fails red instead
          # of skipping green. If go's wording ever drifts, the lane goes
          # red: visible, the safe direction for a monitor. Any other
          # install failure fails the job.
          if ! go install github.com/ConsulTent/mcpcli/cmd/mcp@v1.3.0 2>/tmp/install.log; then
            if grep -q "cmd/mcp@v1.3.0: invalid version: unknown revision" /tmp/install.log; then
              grep "unknown revision" /tmp/install.log >&2
              echo "::notice::mcp v1.3.0 is not published yet — skipping the Jev lane"
              exit 0
            fi
            cat /tmp/install.log >&2
            exit 1
          fi
        fi
        if [ -z "${TYPESAFE_API_KEY:-}" ]; then
          echo "::notice::TYPESAFE_API_KEY is not set — skipping the Jev battery"
          exit 0
        fi

        mcp --command "npx -y @jkudish/jev-mcp@0.14.7" \
          jev check --probe --probe-on-auth-error skip --json --timeout 60s >jev-check.json
        # The battery document is authoritative whatever happened:
        # the five summary counts must always sum to the probe rows.
        jq -e '((.summary.ok // 0) + (.summary.escalate // 0) + (.summary.skipped // 0)
                + (.summary.auth_skipped // 0) + (.summary.errors // 0)) == (.probes | length)' \
          jev-check.json >/dev/null
        if jq -e '.summary.auth_skipped > 0' jev-check.json >/dev/null; then
          echo "::notice::Jev provider key rejected (auth/billing) — battery skipped, job green"
        elif ! jq -e '.summary.errors == 0' jev-check.json >/dev/null; then
          echo "battery reported tool errors"; exit 1
        else
          mcp --command "npx -y @jkudish/jev-mcp@0.14.7" \
            jev ask "is 2+2=4?" --json --timeout 60s | jq -e '.verdicts | length == 1'
        fi
      shell: bash
      env:
        JEV_MCP_INSTALL: ${{ inputs.install }}
