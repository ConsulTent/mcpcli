# Jev PR review with the provider key pulled from Bitwarden Secrets Manager.
#
# A variant of jev-pr-review.yml: the TypeSafe key is never a GitHub secret.
# CI holds only a Bitwarden Secrets Manager machine-account token; `mcp bws
# login` caches it once per job, and every jev run resolves the provider key
# with `--env TYPESAFE_API_KEY=bws://<name>` before the server spawns — the
# value rides process memory, never argv, logs, or a repo secret.
#
# Prerequisites:
#   - mcp >= v1.4.0 (first release with `mcp bws` and `--env`; installed
#     below via go install)
#   - Node (preinstalled on GitHub-hosted runners) for the npx MCP server
#   - secret: MCPCLI_BWS_ACCESS_TOKEN — a Bitwarden Secrets Manager
#     machine-account access token (0.<id>.<secret>:<seed>)
#   - the machine account can read a secret named typesafe-api-key (its
#     value is your TypeSafe key), and --org below carries your organization
#     id so the NAME ref resolves; a uuid ref (bws://<secret-uuid>) works
#     without --org
#
# A dead or unpaid provider key never fails the build: the preflight battery
# runs with --probe-on-auth-error skip, and the jq gate turns "key rejected"
# into a green skip with a notice. A missing BWS token skips the same way.

name: Jev PR review, key from Bitwarden (mcp)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - run: go install github.com/ConsulTent/mcpcli/cmd/mcp@v1.4.0

      - name: Score the diff with jev_review (key from Bitwarden)
        env:
          GH_TOKEN: ${{ github.token }}
          MCPCLI_BWS_ACCESS_TOKEN: ${{ secrets.MCPCLI_BWS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MCPCLI_BWS_ACCESS_TOKEN:-}" ]; then
            echo "::notice::MCPCLI_BWS_ACCESS_TOKEN is not set — skipping Jev review"
            exit 0
          fi

          # The machine-account token arrives via the environment (never
          # argv). Login performs one live exchange to validate it and caches
          # it for the job; --org enables NAME refs.
          mcp bws login --org 00000000-0000-0000-0000-000000000001

          # Preflight: the self-test battery, one call per tool. The provider
          # key resolves from Bitwarden per call (--env below); the jq gate —
          # not the exit code — decides whether to proceed.
          mcp --command "npx -y @jkudish/jev-mcp@0.14.7" \
            --env TYPESAFE_API_KEY=bws://typesafe-api-key \
            jev check --probe --probe-on-auth-error skip --json --timeout 60s >jev-check.json
          jq -e '.summary.auth_skipped == 0 and .summary.errors == 0' jev-check.json >/dev/null || {
            echo "::notice::Jev provider key rejected (auth/billing) — skipping Jev review"
            exit 0
          }

          # The review call. The diff and request text ride --in-file — raw
          # strings read from files, so argv never carries the payload; the
          # provider key rides the same --env reference.
          gh pr diff --patch --color never >pr.diff
          gh pr view --json title,body -q '.title + "\n\n" + (.body // "")' >pr-request.txt
          mcp --command "npx -y @jkudish/jev-mcp@0.14.7" \
            --env TYPESAFE_API_KEY=bws://typesafe-api-key \
            --json --timeout 120s \
            tools call jev_review \
            --in-file request=pr-request.txt --in-file diff=pr.diff \
            --arg tests="see the pull request checks" \
            | tee jev-review.json

          # One --json document (the tool result); the payload is inside it,
          # as structured content or as JSON text — whichever the server sent.
          # Extract it once; every later jq reads plain fields.
          jq '(.structuredContent // (.content[] | select(.type == "text") | .text | fromjson))' \
            jev-review.json >jev-payload.json
          ACTION="$(jq -r '.action' jev-payload.json)"
          case "$ACTION" in
            auto|review|escalate) ;;
            *) echo "unrecognized jev_review action: $ACTION" >&2; exit 1 ;;
          esac

          jq -r --arg action "$ACTION" '
            "Jev review: \($action)\n\n" +
            (if .composite then "composite: \(.composite)\n" else "" end) +
            (if .safe_to_apply then "safe_to_apply: \(.safe_to_apply)\n" else "" end) +
            (if .reason_codes and (.reason_codes | length) > 0 then "reason codes: \(.reason_codes | join(", "))\n" else "" end) +
            (if .limiting_rubrics and (.limiting_rubrics | length) > 0 then "limiting rubrics: \(.limiting_rubrics | join(", "))\n" else "" end) +
            "\nScored by TypeSafe Jev via jev_review; advisory only."
          ' jev-payload.json >review-body.md

          # escalate is still data for the reviewer, not a failed build.
          gh pr review --comment --body-file review-body.md
